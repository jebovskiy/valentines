name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SUPABASE_URL: https://placeholder.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      SUPABASE_ANON_KEY: placeholder
      TELEGRAM_BOT_TOKEN: '123:ABC'
      FCM_SERVICE_ACCOUNT_JSON: '{}'
      WEBHOOK_SHARED_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint changed backend files only (advisory, repo has legacy debt)
        continue-on-error: true
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            mapfile -t files < <(git diff --name-only "$BASE"...HEAD -- '*.ts' | sed 's#^backend/##' | grep '^src/' || true)
          else
            files=()
          fi
          if [ "${#files[@]}" -gt 0 ]; then npx eslint "${files[@]}"; else echo "no changed .ts files to lint"; fi
      - run: npm run typecheck
      - run: npm test

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Ensure gradlew is executable
        run: chmod +x gradlew
      - name: Stub google-services.json (real file is git-ignored)
        run: |
          printf '%s' '{"project_info":{"project_number":"0","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:ci","android_client_info":{"package_name":"app.valentines.companion"}},"oauth_client":[],"api_key":[{"current_key":"CI"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug
      - name: Keep release build unsigned when key.properties is missing
        run: ./gradlew :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: companion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
